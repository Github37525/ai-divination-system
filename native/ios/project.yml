name: DivinationInstrument
options:
  bundleIdPrefix: com.yijing
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  DivinationInstrument:
    type: application
    platform: iOS
    sources:
      - path: DivinationApp
        excludes:
          - Resources
    resources:
      - path: DivinationApp/Resources
    info:
      path: DivinationApp/Info.plist
      properties:
        CFBundleDisplayName: 天文铜仪
        UILaunchScreen: {}
        NSMotionUsageDescription: 用于识别您主动摇动手机的动作；原始传感器数据不会上传。
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yijing.instrument
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: []
